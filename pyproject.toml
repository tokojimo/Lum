[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "luxplate-analyzer"
version = "0.1.0.dev0"
description = "Local, reproducible analysis of bacterial growth and luminescence plate-reader experiments"
requires-python = ">=3.12"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

